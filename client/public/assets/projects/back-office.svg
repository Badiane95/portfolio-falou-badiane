<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Tableau de bord d'un back-office : menu latéral, indicateurs et liste de contenus avec leurs rôles">
  <defs>
    <pattern id="grille" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#C9CEDA"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="#EEF0F4"/>
  <rect width="1200" height="750" fill="url(#grille)"/>

  <g transform="translate(64 56)" font-family="Helvetica Neue, Arial, sans-serif">
    <rect width="1072" height="638" rx="16" fill="#FFFFFF" stroke="#0B1530" stroke-width="2"/>
    <!-- Menu latéral -->
    <path d="M16 0 h204 v638 h-204 a16 16 0 0 1 -16 -16 v-606 a16 16 0 0 1 16 -16 z" fill="#0B1530"/>
    <text x="32" y="56" font-size="20" font-weight="700" fill="#FFFFFF">IUT · Admin</text>
    <g font-size="16">
      <rect x="20" y="96" width="180" height="40" rx="8" fill="#2B3FE0"/>
      <text x="40" y="122" fill="#FFFFFF">Contenus</text>
      <text x="40" y="176" fill="#9FABC6">Actualités</text>
      <text x="40" y="222" fill="#9FABC6">Utilisateurs</text>
      <text x="40" y="268" fill="#9FABC6">Rôles</text>
      <text x="40" y="314" fill="#9FABC6">Réglages</text>
    </g>

    <!-- Barre du haut -->
    <rect x="252" y="28" width="380" height="40" rx="10" fill="#EEF0F4"/>
    <circle cx="276" cy="48" r="8" fill="none" stroke="#5B6478" stroke-width="2"/>
    <line x1="282" y1="54" x2="288" y2="60" stroke="#5B6478" stroke-width="2"/>
    <text x="300" y="54" font-size="15" fill="#5B6478">Rechercher un contenu</text>
    <rect x="904" y="28" width="136" height="40" rx="10" fill="#0B1530"/>
    <text x="972" y="54" font-size="15" fill="#FFFFFF" text-anchor="middle">+ Nouveau</text>

    <!-- Indicateurs -->
    <g transform="translate(252 100)">
      <rect width="250" height="104" rx="12" fill="#EEF0F4"/>
      <text x="22" y="40" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1" fill="#5B6478">CONTENUS</text>
      <text x="22" y="84" font-size="36" font-weight="700" fill="#0B1530">128</text>
    </g>
    <g transform="translate(520 100)">
      <rect width="250" height="104" rx="12" fill="#EEF0F4"/>
      <text x="22" y="40" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1" fill="#5B6478">UTILISATEURS / MOIS</text>
      <text x="22" y="84" font-size="36" font-weight="700" fill="#0B1530">100+</text>
    </g>
    <g transform="translate(788 100)">
      <rect width="252" height="104" rx="12" fill="#2B3FE0"/>
      <text x="22" y="40" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1" fill="#DDE2FB">À VALIDER</text>
      <text x="22" y="84" font-size="36" font-weight="700" fill="#FFFFFF">3</text>
    </g>

    <!-- Liste -->
    <g transform="translate(252 236)">
      <g font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1" fill="#5B6478">
        <text x="0" y="20">TITRE</text>
        <text x="440" y="20">AUTEUR</text>
        <text x="620" y="20">STATUT</text>
      </g>
      <line x1="0" y1="36" x2="788" y2="36" stroke="#C9CEDA" stroke-width="2"/>

      <g font-size="16" fill="#0B1530">
        <text x="0" y="82">Journée portes ouvertes</text>
        <rect x="440" y="64" width="78" height="26" rx="13" fill="#0B1530"/>
        <text x="479" y="82" font-size="13" fill="#FFFFFF" text-anchor="middle">admin</text>
        <circle cx="630" cy="77" r="6" fill="#1F7A4D"/>
        <text x="646" y="82" font-size="15" fill="#5B6478">publié</text>
        <line x1="0" y1="106" x2="788" y2="106" stroke="#EEF0F4" stroke-width="2"/>

        <text x="0" y="148">Planning du semestre 5</text>
        <rect x="440" y="130" width="82" height="26" rx="13" fill="#DDE2FB"/>
        <text x="481" y="148" font-size="13" fill="#2B3FE0" text-anchor="middle">éditeur</text>
        <circle cx="630" cy="143" r="6" fill="#F2A93B"/>
        <text x="646" y="148" font-size="15" fill="#5B6478">à valider</text>
        <line x1="0" y1="172" x2="788" y2="172" stroke="#EEF0F4" stroke-width="2"/>

        <text x="0" y="214">Résultats des projets tutorés</text>
        <rect x="440" y="196" width="82" height="26" rx="13" fill="#DDE2FB"/>
        <text x="481" y="214" font-size="13" fill="#2B3FE0" text-anchor="middle">éditeur</text>
        <circle cx="630" cy="209" r="6" fill="#1F7A4D"/>
        <text x="646" y="214" font-size="15" fill="#5B6478">publié</text>
        <line x1="0" y1="238" x2="788" y2="238" stroke="#EEF0F4" stroke-width="2"/>

        <text x="0" y="280">Offres de stage du mois</text>
        <rect x="440" y="262" width="78" height="26" rx="13" fill="#0B1530"/>
        <text x="479" y="280" font-size="13" fill="#FFFFFF" text-anchor="middle">admin</text>
        <circle cx="630" cy="275" r="6" fill="#C9CEDA"/>
        <text x="646" y="280" font-size="15" fill="#5B6478">brouillon</text>
        <line x1="0" y1="304" x2="788" y2="304" stroke="#EEF0F4" stroke-width="2"/>

        <text x="0" y="346">Ateliers de la semaine</text>
        <rect x="440" y="328" width="82" height="26" rx="13" fill="#DDE2FB"/>
        <text x="481" y="346" font-size="13" fill="#2B3FE0" text-anchor="middle">éditeur</text>
        <circle cx="630" cy="341" r="6" fill="#F2A93B"/>
        <text x="646" y="346" font-size="15" fill="#5B6478">à valider</text>
      </g>
    </g>
    <text x="252" y="624" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#5B6478">PHP · MYSQL · RÔLES ET DROITS</text>
  </g>
</svg>
