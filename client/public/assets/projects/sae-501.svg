<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Maquette du site institutionnel du BUT MMI : en-tête, bandeau d'accueil et cartes de formation">
  <defs>
    <pattern id="grille" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#C9CEDA"/>
    </pattern>
    <pattern id="hachures" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#C9CEDA" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="#EEF0F4"/>
  <rect width="1200" height="750" fill="url(#grille)"/>

  <g transform="translate(96 64)">
    <rect width="1008" height="622" rx="16" fill="#FFFFFF" stroke="#0B1530" stroke-width="2"/>
    <path d="M0 16 a16 16 0 0 1 16 -16 h976 a16 16 0 0 1 16 16 v28 h-1008 z" fill="#0B1530"/>
    <circle cx="24" cy="22" r="5" fill="#5B6478"/>
    <circle cx="42" cy="22" r="5" fill="#5B6478"/>
    <circle cx="60" cy="22" r="5" fill="#5B6478"/>

    <!-- En-tête du site -->
    <rect x="40" y="76" width="84" height="40" rx="8" fill="#2B3FE0"/>
    <text x="82" y="103" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">MMI</text>
    <g font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#5B6478">
      <text x="560" y="102">Formation</text>
      <text x="670" y="102">Projets</text>
      <text x="760" y="102">Équipe</text>
      <text x="846" y="102">Contact</text>
    </g>
    <line x1="40" y1="140" x2="968" y2="140" stroke="#EEF0F4" stroke-width="2"/>

    <!-- Bandeau -->
    <text x="40" y="216" font-family="Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="700" fill="#0B1530">BUT Métiers du Multimédia</text>
    <text x="40" y="266" font-family="Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="700" fill="#0B1530">et de l'Internet</text>
    <rect x="40" y="296" width="420" height="12" rx="6" fill="#EEF0F4"/>
    <rect x="40" y="318" width="340" height="12" rx="6" fill="#EEF0F4"/>
    <rect x="40" y="352" width="176" height="44" rx="10" fill="#0B1530"/>
    <text x="128" y="380" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">Candidater</text>
    <rect x="620" y="176" width="348" height="220" rx="12" fill="url(#hachures)" stroke="#C9CEDA" stroke-width="2"/>

    <!-- Cartes -->
    <g transform="translate(40 432)">
      <rect width="290" height="150" rx="12" fill="#EEF0F4"/>
      <rect x="20" y="22" width="40" height="40" rx="10" fill="#2B3FE0"/>
      <text x="20" y="96" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0B1530">Développement web</text>
      <rect x="20" y="114" width="220" height="10" rx="5" fill="#C9CEDA"/>
    </g>
    <g transform="translate(359 432)">
      <rect width="290" height="150" rx="12" fill="#EEF0F4"/>
      <rect x="20" y="22" width="40" height="40" rx="10" fill="#0B1530"/>
      <text x="20" y="96" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0B1530">Création numérique</text>
      <rect x="20" y="114" width="200" height="10" rx="5" fill="#C9CEDA"/>
    </g>
    <g transform="translate(678 432)">
      <rect width="290" height="150" rx="12" fill="#EEF0F4"/>
      <rect x="20" y="22" width="40" height="40" rx="10" fill="#F2A93B"/>
      <text x="20" y="96" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#0B1530">Communication</text>
      <rect x="20" y="114" width="236" height="10" rx="5" fill="#C9CEDA"/>
    </g>
  </g>
  <text x="96" y="726" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="2" fill="#5B6478">NUNJUCKS · VITE · EXPRESS · MONGODB</text>
</svg>
