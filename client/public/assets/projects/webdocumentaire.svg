<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Graphe de navigation non linéaire d'un webdocumentaire : séquences vidéo reliées par des choix, et frise des chapitres">
