      <text x="0" y="-14" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#8AA0FF">choix A</text>
      <text x="0" y="148" font-size="16" font-weight="600" fill="#E8EDF7">Le quartier</text>
