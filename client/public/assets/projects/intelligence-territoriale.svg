      <text x="32" y="146">#02</text>
      <text x="32" y="190">#03</text>
      <text x="32" y="234">#04</text>
      <text x="32" y="278">#05</text>
    </g>
    <g>
      <rect x="96" y="86" width="760" height="20" rx="4" fill="#EEF0F4"/>
      <rect x="96" y="86" width="699" height="20" rx="4" fill="#2B3FE0"/>
      <rect x="96" y="130" width="760" height="20" rx="4" fill="#EEF0F4"/>
      <rect x="96" y="130" width="616" height="20" rx="4" fill="#2B3FE0" opacity="0.85"/>
      <rect x="96" y="174" width="760" height="20" rx="4" fill="#EEF0F4"/>
      <rect x="96" y="174" width="585" height="20" rx="4" fill="#2B3FE0" opacity="0.7"/>
      <rect x="96" y="218" width="760" height="20" rx="4" fill="#EEF0F4"/>
      <rect x="96" y="218" width="486" height="20" rx="4" fill="#2B3FE0" opacity="0.5"/>
      <rect x="96" y="262" width="760" height="20" rx="4" fill="#EEF0F4"/>
      <rect x="96" y="262" width="365" height="20" rx="4" fill="#2B3FE0" opacity="0.35"/>
    </g>
    <g font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="600" fill="#0B1530" text-anchor="end">
      <text x="930" y="102">92</text>
      <text x="930" y="146">81</text>
      <text x="930" y="190">77</text>
      <text x="930" y="234">64</text>
      <text x="930" y="278">48</text>
    </g>
    <g transform="translate(962 84)">
      <rect width="66" height="26" rx="13" fill="#F2A93B"/>
      <text x="33" y="18" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#0B1530" text-anchor="middle">TOP</text>
    </g>
  </g>
</svg>
