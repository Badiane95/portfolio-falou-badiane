<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Schéma du pipeline : collecte, nettoyage, classification NLP, scoring, intégration ERP/CRM">
  <defs>
    <pattern id="grille" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#C9CEDA"/>
    </pattern>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0B1530"/>
    </marker>
  </defs>
  <rect width="1200" height="750" fill="#EEF0F4"/>
  <rect width="1200" height="750" fill="url(#grille)"/>

  <text x="72" y="92" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" letter-spacing="3" fill="#5B6478">PIPELINE · INTELLIGENCE TERRITORIALE</text>

  <!-- Étapes -->
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <g transform="translate(72 170)">
      <rect width="176" height="120" rx="14" fill="#FFFFFF" stroke="#0B1530" stroke-width="2"/>
      <text x="20" y="38" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#5B6478">01</text>
      <text x="20" y="74" font-size="24" font-weight="600" fill="#0B1530">Collecte</text>
      <text x="20" y="100" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#5B6478">API · 60+ sources</text>
    </g>
    <g transform="translate(290 170)">
      <rect width="176" height="120" rx="14" fill="#FFFFFF" stroke="#0B1530" stroke-width="2"/>
      <text x="20" y="38" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#5B6478">02</text>
      <text x="20" y="74" font-size="24" font-weight="600" fill="#0B1530">Nettoyage</text>
      <text x="20" y="100" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#5B6478">pandas</text>
    </g>
    <g transform="translate(508 170)">
      <rect width="176" height="120" rx="14" fill="#FFFFFF" stroke="#0B1530" stroke-width="2"/>
      <text x="20" y="38" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#5B6478">03</text>
      <text x="20" y="74" font-size="24" font-weight="600" fill="#0B1530">NLP</text>
      <text x="20" y="100" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#5B6478">classification</text>
    </g>
    <g transform="translate(726 170)">
      <rect width="176" height="120" rx="14" fill="#2B3FE0"/>
      <text x="20" y="38" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#DDE2FB">04</text>
      <text x="20" y="74" font-size="24" font-weight="600" fill="#FFFFFF">Scoring</text>
      <text x="20" y="100" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#DDE2FB">score 0 – 100</text>
    </g>
    <g transform="translate(944 170)">
      <rect width="184" height="120" rx="14" fill="#0B1530"/>
      <text x="20" y="38" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#9FABC6">05</text>
      <text x="20" y="74" font-size="24" font-weight="600" fill="#FFFFFF">ERP / CRM</text>
      <text x="20" y="100" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#9FABC6">intégration</text>
    </g>
  </g>
  <g stroke="#0B1530" stroke-width="2" marker-end="url(#fleche)">
    <line x1="250" y1="230" x2="286" y2="230"/>
    <line x1="468" y1="230" x2="504" y2="230"/>
    <line x1="686" y1="230" x2="722" y2="230"/>
    <line x1="904" y1="230" x2="940" y2="230"/>
