<!doctype html>
<html lang="fr" data-theme="nuit" class="dark">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Falou Badiane — Ingénieur IA & data</title>
    <meta name="description" content="Portfolio de Falou Badiane, Forward Deployed Engineer – Ingénieur IA en alternance chez Randstad Digital (Master IID, Paris 8) : IA appliquée, data, automatisation et développement full-stack." />
    <meta name="theme-color" content="#0b1530" />
    <script>
      // Pose le thème avant le premier rendu pour éviter un flash de couleur.
      // Identifiants à garder synchronisés avec client/src/lib/themes.ts.
      (function () {
        var colors = { clair: "#ffffff", nuit: "#0b1530", noir: "#0a0a0a" };
        var theme;
        try { theme = localStorage.getItem("theme"); } catch (e) {}
        // Sans choix enregistré, le site s'ouvre en bleu nuit (thème par défaut).
        if (!colors[theme]) theme = "nuit";
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.classList.toggle("dark", theme !== "clair");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", colors[theme]);
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Falou Badiane — Ingénieur IA & data" />
    <meta property="og:description" content="IA appliquée, data, automatisation et développement full-stack." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111110'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='13' fill='%23f6f6f3' text-anchor='middle'%3EFB%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
